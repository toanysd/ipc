[NetworkDeviceManager]
; Network Device Manager - Configuration
;
; Duong dan du an IPC (tuong doi hoac tuyet doi)
; Mac dinh: .. (thu muc cha cua CoreService)
; Khi cai vao ProgramData, installer se tu dong cap nhat thanh duong dan tuyet doi
PROJECT_DIR=..
;
; Port uu tien
PORT=4200
;
; Dai port mo firewall
PORT_RANGE_START=4200
PORT_RANGE_END=4220
;
; Che do chay: dev hoac production
MODE=dev
